<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Fechamentos Contábeis</title>
<script>
  window.__fbReady = new Promise(resolve => { window.__fbReadyResolve = resolve; });
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@700;800&display=swap');

:root{
  --ink:#e8edfb;
  --ink-soft:#b4bbdc;
  --paper:rgba(255,255,255,0.04);
  --paper-raised:rgba(180,200,255,0.05);
  --rule:rgba(160,180,255,0.10);
  --rule-strong:rgba(160,180,255,0.25);
  --red:#f87171;
  --red-bg:rgba(248,113,113,0.15);
  --amber:#f2c14e;
  --amber-bg:rgba(242,193,78,0.15);
  --blue:#38bdf8;
  --blue-bg:rgba(56,189,248,0.15);
  --green:#34d399;
  --green-bg:rgba(52,211,153,0.15);
  --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 14px rgba(0,0,0,0.2);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:980px;margin:0 auto;padding:28px 20px 80px;}

/* header */
.topbar{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:18px;margin-bottom:22px;
  border-bottom:2px solid var(--ink);
  gap:16px;flex-wrap:wrap;
}
.brand h1{
  font-family:'Source Serif 4',serif;
  font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-0.01em;
}
.brand .sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
.top-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.cricon-brand{display:flex;align-items:center;gap:8px;}
.cricon-brand svg{width:28px;height:auto;flex-shrink:0;}
.cricon-brand .cw{line-height:1.05;text-align:right;}
.cricon-brand .cw .nm{font-family:'Source Serif 4',serif;font-style:italic;font-weight:700;font-size:14px;color:#5D4232;white-space:nowrap;}
.cricon-brand .cw .tg{font-family:'IBM Plex Sans',sans-serif;font-size:9px;color:var(--ink-soft);letter-spacing:.02em;white-space:nowrap;}
select, .btn, input[type=text]{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:13.5px;
}
select{
  padding:8px 10px;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper-raised);color:var(--ink);font-weight:500;
}
.btn{
  padding:8px 14px;border-radius:3px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);
  cursor:pointer;font-weight:600;transition:transform .08s ease, opacity .15s;
}
.btn:hover{opacity:.88;}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.ghost:hover{background:rgba(0,0,0,0.06);}
.btn.small{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--ink);
}
.icon-btn:hover{background:rgba(0,0,0,0.06);}

/* month nav */
.month-nav{
  display:flex;align-items:center;gap:12px;margin-bottom:20px;
}
.month-nav .month-label{
  font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:.02em;
  min-width:150px;text-align:center;text-transform:capitalize;
}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
.who-email{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}

/* ledger table */
.ledger{
  background:var(--paper-raised);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;box-shadow:var(--shadow);
}
.ledger-head{
  display:grid;grid-template-columns:1fr 150px 130px 170px 40px;
  padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);border-bottom:1.5px solid var(--rule-strong);background:rgba(0,0,0,0.02);
}
.ledger-row{
  display:grid;grid-template-columns:1fr 150px 130px 170px 40px;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .12s;
}
.ledger-row:last-child{border-bottom:none;}
.ledger-row:hover{background:rgba(0,0,0,0.03);}
.client-name{font-weight:600;font-size:14.5px;}
.client-name .assign{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:400;margin-top:2px;font-family:'IBM Plex Mono',monospace;}
.note-flag{font-size:12px;vertical-align:middle;}
.responsible-tag{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.02em;
  color:var(--blue);background:var(--blue-bg);padding:2px 7px;border-radius:10px;vertical-align:middle;margin-left:4px;
}
.regime-cell{font-size:12px;color:var(--ink-soft);}
.regime-cell.empty{color:var(--rule-strong);font-style:italic;}
.progress-wrap{display:flex;align-items:center;gap:8px;}
.progress-bar{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden;}
.progress-bar > div{height:100%;background:var(--ink);border-radius:3px;transition:width .25s ease;}
.progress-pct{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);width:32px;text-align:right;}
.chev{color:var(--rule-strong);font-size:18px;}

.filter-bar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;
}
.filter-bar input[type=text]{
  flex:1;min-width:160px;padding:8px 10px;border:1.5px solid var(--rule-strong);border-radius:3px;background:var(--paper-raised);
}
.filter-bar select{padding:8px 10px;border:1.5px solid var(--rule-strong);border-radius:3px;background:var(--paper-raised);font-size:12.5px;}
.filter-bar .spacer{flex:1;}
.filter-bar .export-group{display:flex;gap:8px;margin-left:auto;}
.resp-summary{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px;}
.resp-chip{background:var(--paper-raised);border:1px solid var(--rule-strong);border-radius:3px;padding:4px 8px;min-width:110px;text-align:left;font:inherit;color:inherit;}
button.resp-chip{cursor:pointer;}
button.resp-chip:hover{border-color:var(--ink);}
.resp-chip.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
.resp-chip.total{background:transparent;border-style:dashed;}
.resp-chip .rc-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:600;}
.resp-chip .rc-bar{height:3px;background:var(--rule);border-radius:2px;margin:3px 0 2px;overflow:hidden;}
.resp-chip .rc-bar div{height:100%;background:var(--ink);}
.resp-chip .rc-sub{font-size:10px;color:var(--ink-soft);}

/* stamp */
.stamp{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:'Source Serif 4',serif;font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 10px;border-radius:3px;border:1.5px solid currentColor;transform:rotate(-1.5deg);white-space:nowrap;
}
.stamp.pendente{color:var(--red);background:var(--red-bg);}
.stamp.em_conferencia{color:var(--amber);background:var(--amber-bg);}
.stamp.revisao_final{color:var(--blue);background:var(--blue-bg);}
.stamp.concluido{color:var(--green);background:var(--green-bg);}

.empty-state{
  padding:60px 20px;text-align:center;color:var(--ink-soft);
}
.empty-state h3{font-family:'Source Serif 4',serif;color:var(--ink);font-size:19px;margin-bottom:6px;}
.empty-state p{font-size:13.5px;margin:0 0 16px;}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;z-index:50;
}
.modal{
  background:var(--paper-raised);border-radius:6px;max-width:620px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);
  border:1.5px solid var(--ink);
}
.modal-head{
  display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;border-bottom:1.5px solid var(--rule-strong);
}
.modal-head h2{font-family:'Source Serif 4',serif;font-size:20px;margin:0 0 4px;}
.modal-head .meta{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px 22px;border-top:1px solid var(--rule);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.close-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
.close-x:hover{color:var(--ink);}

/* trail */
.trail{display:flex;align-items:center;gap:6px;margin-bottom:22px;}
.trail .node{
  flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;
  padding:8px 4px;border-radius:3px;background:var(--rule);color:var(--ink-soft);position:relative;
}
.trail .node.active{background:var(--ink);color:var(--paper);font-weight:600;}
.trail .node.done{background:var(--rule-strong);color:var(--ink);font-weight:600;}
.trail .node.done::after{content:" ✓";}

.checklist{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--rule);}
.select-all-row{
  display:flex;align-items:center;gap:8px;padding:8px 2px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.02em;color:var(--ink-soft);
  border-bottom:1px dashed var(--rule-strong);
}
.select-all-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);cursor:pointer;}
.cascade-toggle{
  display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);cursor:pointer;margin-right:auto;
}
.cascade-toggle input[type=checkbox]{width:15px;height:15px;accent-color:var(--ink);cursor:pointer;}
.checklist li{
  display:flex;align-items:flex-start;gap:10px;padding:11px 2px;border-bottom:1px solid var(--rule);font-size:13.5px;
}
.checklist li.done{color:var(--ink-soft);}
.checklist li.done > .item-body > span{text-decoration:line-through;text-decoration-color:var(--rule-strong);}
.checklist input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink);cursor:pointer;flex-shrink:0;margin-top:2px;}
.checklist input[type=checkbox]:disabled{cursor:not-allowed;}
.item-body{flex:1;min-width:0;}
details.guide{margin-top:5px;}
details.guide summary{
  cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--blue);letter-spacing:.02em;list-style:none;
  display:inline-flex;align-items:center;gap:4px;
}
details.guide summary::-webkit-details-marker{display:none;}
details.guide summary::before{content:"›";transition:transform .15s;}
details.guide[open] summary::before{transform:rotate(90deg);}
details.guide p{
  margin:6px 0 0;padding:9px 11px;background:rgba(0,0,0,0.05);border-left:2px solid var(--blue);border-radius:0 3px 3px 0;
  font-size:12.5px;line-height:1.5;color:var(--ink-soft);white-space:pre-wrap;
}
.note-field{margin-top:8px;}
.note-field label{
  display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink-soft);margin-bottom:4px;
}
.note-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;}
.note-field input{
  width:100%;padding:7px 10px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--paper);
  font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:var(--ink);
}
.note-field input:focus{outline:none;border-color:var(--blue);}
.note-field input:disabled{background:transparent;color:var(--ink-soft);border-color:var(--rule);}
.note-field input::placeholder{color:var(--rule-strong);}

.section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 8px;}

.signoffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
.signoff{border:1px solid var(--rule);border-radius:4px;padding:10px;font-size:11.5px;}
.signoff .role{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-size:10px;margin-bottom:4px;}
.signoff .name{font-weight:600;font-size:13px;}
.signoff .empty{color:var(--rule-strong);font-style:italic;}

.hint{font-size:12px;color:var(--ink-soft);background:rgba(0,0,0,0.04);border-radius:4px;padding:10px 12px;margin-top:4px;}
.hint.warn{background:var(--amber-bg);color:#5C4400;font-weight:600;border-left:3px solid var(--amber);}

.history{margin-top:16px;}
.history ul{list-style:none;margin:0;padding:0;}
.history li{font-size:12px;color:var(--ink-soft);padding:5px 0;border-bottom:1px dashed var(--rule);font-family:'IBM Plex Mono',monospace;}

/* config */
.cfg-block{margin-bottom:24px;}
.cfg-block h3{font-family:'Source Serif 4',serif;font-size:15.5px;margin:0 0 10px;}
.cfg-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.cfg-item{display:flex;align-items:center;gap:8px;}
.cfg-item input[type=text]{flex:1;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--paper);}
.cfg-item select{width:172px;flex-shrink:0;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--paper);font-size:12px;}
.cfg-item .del{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:2px 6px;}
.cfg-client-item{border:1px solid var(--rule);border-radius:4px;padding:8px;margin-bottom:2px;}
.cfg-client-item .cfg-item{margin-bottom:6px;}
.cfg-client-selects{display:flex;gap:8px;}
.cfg-client-selects select{flex:1;width:auto;padding:7px 8px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--paper);font-size:12px;}

#printReport{display:none;}
@media print{
  body *{visibility:hidden;}
  #printReport, #printReport *{visibility:visible;}
  #printReport{display:block !important;position:absolute;top:0;left:0;width:100%;padding:10px;}
  #printReport h1{font-family:'Source Serif 4',serif;font-size:18px;margin:0 0 2px;}
  #printReport h2{font-size:12.5px;font-weight:500;color:#555;margin:0 0 14px;}
  #printReport table{width:100%;border-collapse:collapse;font-size:10.5px;}
  #printReport th, #printReport td{border:1px solid #999;padding:6px 8px;text-align:left;}
  #printReport th{background:#eee;}
  #printReport .print-footer{margin-top:12px;font-size:9.5px;color:#777;}
}
.cfg-filter-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.cfg-filter-row input{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:3px;}
.cfg-filter-row select{padding:8px 10px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--paper-raised);font-size:12.5px;}
.add-row{display:flex;gap:8px;}
.add-row input{flex:1;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:3px;}
.import-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.hint-inline{font-size:11.5px;color:var(--ink-soft);}
.cfg-tpl-item{border:1px solid var(--rule);border-radius:4px;padding:8px;margin-bottom:2px;}
.cfg-tpl-item .cfg-item{margin-bottom:0;}
.guide-edit summary{
  cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--blue);margin-top:6px;list-style:none;
}
.guide-edit summary::-webkit-details-marker{display:none;}
.guide-edit textarea{
  width:100%;margin-top:6px;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:3px;
  font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;resize:vertical;background:var(--paper);
}

.loading{padding:80px 20px;text-align:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}

.setup-screen{max-width:640px;margin:60px auto;padding:0 20px;}
.setup-screen h2{font-family:'Source Serif 4',serif;font-size:22px;margin-bottom:6px;}
.setup-screen p{font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
.setup-screen ol{padding-left:20px;font-size:13.5px;line-height:1.9;}
.setup-screen code{
  background:rgba(0,0,0,0.06);padding:2px 6px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:12px;
}
.setup-screen .box{
  background:var(--paper-raised);border:1.5px solid var(--ink);border-radius:6px;padding:20px 24px;margin-top:16px;
}
.login-box{max-width:340px;}
.login-field{margin-bottom:14px;}
.login-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:5px;}
.login-field input{width:100%;padding:9px 11px;border:1.5px solid var(--rule-strong);border-radius:3px;background:var(--paper);font-size:14px;}
.login-field input:focus{outline:none;border-color:var(--ink);}
.login-error{color:var(--red);font-size:12.5px;min-height:16px;}

@media (max-width:640px){
  .ledger-head{display:none;}
  .ledger-row{grid-template-columns:1fr auto;grid-template-areas:"name chev" "regime regime" "progress status";row-gap:6px;padding:14px;}
  .client-name{grid-area:name;}
  .chev{grid-area:chev;}
  .regime-cell{grid-area:regime;}
  .progress-wrap{grid-area:progress;}
  .ledger-row > .stamp-cell{grid-area:status;justify-self:start;}
  .signoffs{grid-template-columns:1fr;}
  .month-nav{flex-wrap:wrap;}
  .who{margin-left:0;width:100%;}
  .filter-bar .export-group{margin-left:0;width:100%;}
}

/* ===== Visual escuro (layout Stagiario) ===== */
:root{color-scheme:dark;--accent1:#4f6bff;--accent2:#38bdf8;--accent-grad:linear-gradient(135deg,#4f6bff,#38bdf8);--panel:rgba(180,200,255,.05);--panel-border:rgba(160,180,255,.1);}
body{background:#131849;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#0b0f33 0%,#131849 35%,#1b2057 70%,#21265f 100%),radial-gradient(ellipse 60% 40% at 70% 30%,rgba(140,80,220,.12),transparent 70%);}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-size:340px 340px;background-image:radial-gradient(1px 1px at 15% 25%,#cfe0ff 100%,transparent),radial-gradient(1px 1px at 65% 8%,#fff 100%,transparent),radial-gradient(1px 1px at 40% 60%,#b9c9ff 100%,transparent),radial-gradient(1px 1px at 85% 45%,#fff 100%,transparent),radial-gradient(1px 1px at 10% 80%,#cfe0ff 100%,transparent);}
.app{position:relative;z-index:1;max-width:1100px;}
select,input[type=text],input[type=email],input[type=password],textarea{color:var(--ink);}
select{background:rgba(255,255,255,.04);border:1px solid var(--panel-border);border-radius:10px;font-weight:400;}
select option{background:#0b0f1e;color:#e8edfb;}
.btn{background:var(--accent-grad);border:none;border-radius:10px;color:#fff;}
.btn.ghost{background:none;border:1px solid var(--panel-border);color:var(--ink-soft);}
.btn.ghost:hover{background:rgba(255,255,255,.05);color:var(--ink);}
.icon-btn{border:1px solid var(--panel-border);background:var(--panel);color:var(--ink-soft);border-radius:10px;width:36px;height:36px;}
.icon-btn:hover{background:rgba(255,255,255,.07);border-color:var(--accent2);}
.pill{background:var(--panel);border:1px solid var(--panel-border);color:var(--ink-soft);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.pill:hover{border-color:var(--accent2);color:var(--ink);}
.pill.rank{background:var(--accent-grad);border-color:transparent;color:#fff;font-weight:700;}

.topbar{border-bottom:1px solid var(--panel-border);position:sticky;top:0;z-index:30;background:rgba(13,20,48,.9);backdrop-filter:blur(12px);margin:-28px -20px 22px;padding:18px 20px;}
@media print{.topbar{position:static;}}
.brand{display:flex;align-items:center;gap:12px;}
.brand .orb{width:44px;height:44px;border-radius:50%;background:#f4efe9;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand .orb svg{width:27px;height:auto;}
.brand h1{font-family:"Orbitron",-apple-system,"Segoe UI",sans-serif;font-size:19px;font-weight:800;letter-spacing:.02em;margin:0;}
.brand .sub{font-family:inherit;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-soft);}
.month-nav .month-label{font-family:inherit;}
.who-email{font-family:inherit;}

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ============================================================
  //  COLE AQUI a configuração do seu projeto Firebase
  //  (Console do Firebase > Configurações do projeto > Seus apps > Config)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBJF5e8R1kXmOc8u_e6wHpwwD4hYHJQcv4",
    authDomain: "fechamento-contabil-7f0b7.firebaseapp.com",
    projectId: "fechamento-contabil-7f0b7",
    storageBucket: "fechamento-contabil-7f0b7.firebasestorage.app",
    messagingSenderId: "661081450640",
    appId: "1:661081450640:web:dd144f63730a6a48465015",
    measurementId: "G-8M7FRZQ79C"
  };
  // ============================================================

  const COLLECTION = "fechamentos_escritorio";

  window.__fbConfigured = firebaseConfig.apiKey !== "SUA_API_KEY_AQUI";
  window.__fbUser = null;

  if(window.__fbConfigured){
    try{
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      window.__fbGet = async function(key){
        const snap = await getDoc(doc(db, COLLECTION, key));
        return snap.exists() ? snap.data().json : null;
      };
      window.__fbSet = async function(key, jsonStr){
        await setDoc(doc(db, COLLECTION, key), { json: jsonStr, updatedAt: Date.now() });
      };
      window.__fbListMonthDocs = async function(){
        const snap = await getDocs(collection(db, COLLECTION));
        const result = {};
        snap.forEach(d=>{
          if(d.id.startsWith('month:')){
            result[d.id.slice(6)] = d.data().json;
          }
        });
        return result;
      };
      window.__fbSignIn = async function(email, password){
        try{
          await signInWithEmailAndPassword(auth, email, password);
          return { ok:true };
        }catch(e){
          return { ok:false, code: e.code || '' };
        }
      };
      window.__fbSignOut = async function(){
        await signOut(auth);
      };

      let authResolved = false;
      onAuthStateChanged(auth, (user)=>{
        window.__fbUser = user ? { email: user.email } : null;
        if(!authResolved){
          authResolved = true;
          window.__fbReadyResolve();
        }else if(window.__onAuthChange){
          window.__onAuthChange();
        }
      });
    }catch(e){
      console.error('Erro ao iniciar Firebase', e);
      window.__fbConfigured = false;
      window.__fbReadyResolve();
    }
  }else{
    window.__fbReadyResolve();
  }
</script>

const TAX_REGIMES = ["Simples Nacional", "Lucro Presumido", "Lucro Real", "Isenta/Imune", "MEI"];

let config = null;

function setCascadeEnabled(checked){ cascadeEnabled = checked; }

function monthKeyFromDate(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function monthLabel(key){
  const [y,m] = key.split("-").map(Number);
  const names = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  return names[m-1] + " de " + y;
}
function shiftMonth(key, delta){
  let [y,m] = key.split("-").map(Number);
  m += delta;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  return y + "-" + String(m).padStart(2,"0");
}
function nowStr(){
  return new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

async function boot(){
  await window.__fbReady;
  if(!window.__fbConfigured){
    loaded = 'setup';
    render();
    return;
  }
  if(!window.__fbUser){
    loaded = 'login';
    render();
    return;
  }
  await loadAll();
}

window.__onAuthChange = function(){
  if(!window.__fbUser){
    loaded = 'login';
    config = null;
    render();
  }else if(loaded==='login'){
    loadAll();
  }
};

async function handleLogin(){
  const emailEl = document.getElementById('loginEmail');
  const passEl = document.getElementById('loginPassword');
  const errEl = document.getElementById('loginError');
  const email = emailEl.value.trim();
  const password = passEl.value;
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Preencha e-mail e senha.'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Entrando…';
  const result = await window.__fbSignIn(email, password);
  if(!result.ok){
    errEl.textContent = 'E-mail ou senha inválidos.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
  // sucesso: onAuthStateChanged dispara e carrega os dados automaticamente
}

async function handleLogout(){
  await window.__fbSignOut();
}

async function loadAll(){
  try{
    const raw = await window.__fbGet('config');
    config = raw ? JSON.parse(raw) : null;
  }catch(e){ console.error(e); config = null; }
  if(!config){
    config = { officeName: "Contabilidade Cricon", teamMembers: [], clients: [], checklistTemplate: DEFAULT_CHECKLIST.slice() };
  }
  if(!config.memberEmails) config.memberEmails = {};
  const defaultStart = new Date().getFullYear() + '-01';
  let migrated = false;
  config.clients.forEach(c=>{ if(!c.startMonth){ c.startMonth = defaultStart; migrated = true; } });
  if(migrated) saveConfig();
  const emailKey = (window.__fbUser && window.__fbUser.email) ? window.__fbUser.email.toLowerCase() : null;
  if(emailKey && config.memberEmails[emailKey] && config.teamMembers.includes(config.memberEmails[emailKey])){
    currentUser = config.memberEmails[emailKey];
  }
  await loadMonth(currentMonthKey);
  loaded = true;
  render();
}

async function loadMonth(key){
  try{
    const raw = await window.__fbGet('month:'+key);
    monthData = raw ? JSON.parse(raw) : {};
    // etapa "Em conferência" foi removida: registros antigos vão direto para a revisão final
    Object.values(monthData).forEach(e=>{
      if(e && e.status==='em_conferencia'){
        e.status = 'revisao_final';
        if(e.checklist) e.checklist.forEach(i=>{ i.done = true; });
      }
    });
  }catch(e){
    console.error(e);
    monthData = {};
  }
}

async function saveConfig(){

function getClosing(clientId){
  if(!monthData[clientId]){
    monthData[clientId] = {
      status:'pendente',
      checklist: config.checklistTemplate.map((t,i)=>{
        const text = typeof t === 'string' ? t : t.text;
        const guide = typeof t === 'string' ? '' : (t.guide||'');
        return {id:'i'+i, text, guide, done:false, confDone:false, note:''};
      }),
      executor:null, executedAt:null,
      conferente:null, conferidoAt:null,
      aprovador:null, finalizadoAt:null,
      history:[]
    };
  }
  return monthData[clientId];
}

function pct(closing){
  const stage = closing.status;
  const total = closing.checklist.length || 1;
  if(stage==='pendente'){
    return Math.round(100*closing.checklist.filter(i=>i.done).length/total);
  }
  return 100;
}

const STATUS_ORDER = {pendente:0, em_conferencia:1, revisao_final:1, concluido:2};

async function cascadePreviousMonths(clientId, targetStatus){
  const targetRank = STATUS_ORDER[targetStatus];
  let key = shiftMonth(currentMonthKey, -1);
  let updated = 0;
  for(let i=0; i<24; i++){
    let raw;
    try{ raw = await window.__fbGet('month:'+key); }catch(e){ raw = null; }
    const data = raw ? JSON.parse(raw) : {};
    let entry = data[clientId];
    const rank = entry ? STATUS_ORDER[entry.status] : -1;
    if(rank >= targetRank){ break; } // esse mês (e os anteriores a ele, presumivelmente) já estão em dia
    if(!entry){
      entry = {
        status:'pendente',
        checklist: config.checklistTemplate.map((t,idx)=>{
          const text = typeof t==='string' ? t : t.text;
          const guide = typeof t==='string' ? '' : (t.guide||'');
          return {id:'i'+idx, text, guide, done:false, confDone:false, note:''};
        }),
        executor:null, executedAt:null, conferente:null, conferidoAt:null, aprovador:null, finalizadoAt:null, history:[]
      };
    }
    entry.checklist.forEach(it=>{ it.done = true; });
    entry.status = targetStatus;
    if(targetRank>=1 && !entry.executor){ entry.executor = currentUser; entry.executedAt = nowStr(); }
    if(targetRank>=2){ entry.aprovador = currentUser; entry.finalizadoAt = nowStr(); }
    entry.history = entry.history || [];
    entry.history.push({t: nowStr(), who: currentUser, what: `Atualizado automaticamente em lote a partir do fechamento de ${monthLabel(currentMonthKey)}`});
    data[clientId] = entry;
    try{ await window.__fbSet('month:'+key, JSON.stringify(data)); updated++; }catch(e){ console.error(e); break; }
    key = shiftMonth(key, -1);
  }
  return updated;
}

async function sendToFinalReview(clientId){
  const c = getClosing(clientId);

  c.status='revisao_final'; c.executor=currentUser; c.executedAt=nowStr();

  render(); saveMonth();
  if(cascadeEnabled){ cascadePreviousMonths(clientId, 'revisao_final'); }
}
async function finalizeClosing(clientId){

  if(!currentUser){ alert('Selecione seu nome antes de continuar.'); return; }

  c.history.push({t:nowStr(), who:currentUser, what:'Finalizou o fechamento'});

// 1ª etapa = execução do checklist (status "pendente"); depois que o cliente sai de
// "pendente" essa etapa conta como 100% concluída.
function stage1Pct(c){
  if(c.status!=='pendente') return 100;
  const total = c.checklist.length || 1;
  return 100*c.checklist.filter(i=>i.done).length/total;
}
const RESP_SUMMARY_HIDE = ['jache'];
function getResponsibleSummary(){
  const map = {};
  visibleClients(currentMonthKey).forEach(cl=>{
    const key = cl.responsible || '__none__';
    const c = getClosing(cl.id);
    const e = map[key] || (map[key] = {key, name: cl.responsible || 'Sem responsável', n:0, sum:0, done:0});
    e.n++; e.sum += stage1Pct(c); if(c.status!=='pendente') e.done++;
  });
  const list = Object.values(map).map(e=>({...e, pct: Math.round(e.sum/e.n)}));
  list.sort((a,b)=> a.key==='__none__' ? 1 : b.key==='__none__' ? -1 : a.name.localeCompare(b.name));
  return list;
}
function toggleRespFilter(i){
  const s = getResponsibleSummary()[i];
  if(!s) return;
  filterResponsible = (filterResponsible===s.key) ? '' : s.key;
  render();
}
function respSummaryHtml(){
  const list = getResponsibleSummary();
  if(!list.length) return '';
  const totalN = list.reduce((a,e)=>a+e.n,0);
  const totalSum = list.reduce((a,e)=>a+e.sum,0);
  const totalDone = list.reduce((a,e)=>a+e.done,0);
  const totalPct = Math.round(totalSum/totalN);
  const chip = (tag, cls, name, p, done, n, extra)=>`<${tag} class="resp-chip ${cls}" ${extra}>
      <div class="rc-top"><span>${escapeHtml(name)}</span><span>${p}%</span></div>
      <div class="rc-bar"><div style="width:${p}%"></div></div>
      <div class="rc-sub">${done}/${n} Clientes concluídos</div>
    </${tag}>`;
  return `<div class="resp-summary" title="1ª etapa = fechamento inicial (execução do checklist, antes da revisão final)">`
    + chip('div','total','Total do escritório',totalPct,totalDone,totalN,'')
    + list.map((e,i)=> RESP_SUMMARY_HIDE.some(h=>e.name.toLowerCase().startsWith(h)) ? '' : chip('button', filterResponsible===e.key?'active':'', e.name, e.pct, e.done, e.n, `type="button" onclick="toggleRespFilter(${i})"`)).join('')
    + `</div>`;
}

function getCfgClients(){
  let list = config.clients.filter(c=>!c.closed);
  const q = cfgClientSearch.trim().toLowerCase();
  if(q){
    list = list.filter(c=>
      c.name.toLowerCase().includes(q) ||
      (c.taxRegime||'').toLowerCase().includes(q) ||
      (c.responsible||'').toLowerCase().includes(q)
    );
  }
  const byName = (a,b)=> a.name.localeCompare(b.name);
  list.sort((a,b)=>{
    if(cfgClientSort==='name_desc') return byName(b,a);
    if(cfgClientSort==='regime') return (a.taxRegime||'￿').localeCompare(b.taxRegime||'￿') || byName(a,b);
    if(cfgClientSort==='responsible') return (a.responsible||'￿').localeCompare(b.responsible||'￿') || byName(a,b);
    return byName(a,b);
  });
  return list;
}

function getFilteredSortedClients(){
  let list = visibleClients(currentMonthKey).map(cl=>({ cl, c: getClosing(cl.id) }));
  if(filterSearch.trim()){
    const q = filterSearch.trim().toLowerCase();
    list = list.filter(x=>x.cl.name.toLowerCase().includes(q));
  }
  if(filterStatus){
    list = list.filter(x=>x.c.status===filterStatus);
  }
  if(filterRegime){
    if(filterRegime==='__none__'){ list = list.filter(x=>!x.cl.taxRegime); }
    else{ list = list.filter(x=>x.cl.taxRegime===filterRegime); }
  }
  if(filterResponsible){
    if(filterResponsible==='__none__'){ list = list.filter(x=>!x.cl.responsible); }
    else{ list = list.filter(x=>x.cl.responsible===filterResponsible); }
  }
  const statusOrder = STATUS_ORDER;
  list.sort((a,b)=>{
    if(sortBy==='regime') return (a.cl.taxRegime||'\uffff').localeCompare(b.cl.taxRegime||'\uffff') || a.cl.name.localeCompare(b.cl.name);
    if(sortBy==='status') return (statusOrder[a.c.status]-statusOrder[b.c.status]) || a.cl.name.localeCompare(b.cl.name);
    return a.cl.name.localeCompare(b.cl.name);
  });
  return list;
}

function monthKeyToShort(key){
  if(!key) return '—';
  const [y,m] = key.split('-');
  return `${m}/${y.slice(2)}`;
}

const MONTH_ABBR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function monthKeyToAbbr(key){
  const [y,m] = key.split('-').map(Number);
  return `${MONTH_ABBR[m-1]}/${String(y).slice(2)}`;
}

function buildPeriodSummary(list, timelines){
  const allKeys = [];
  list.forEach(({cl})=>{
    const t = timelines[cl.id] || {};
    if(t.fechadoAte) allKeys.push(t.fechadoAte);
    if(t.conferidoAte) allKeys.push(t.conferidoAte);
  });
  const startKey = allKeys.length ? allKeys.slice().sort()[0] : currentMonthKey;
  const endKey = shiftMonth(currentMonthKey, 6);
  const periods = [];
  let k = startKey, guard = 0;
  while(k <= endKey && guard < 60){ periods.push(k); k = shiftMonth(k,1); guard++; }

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);

  return periods.map(pk=>{
    const [y,m] = pk.split('-').map(Number);
    const periodDate = new Date(y, m-1, 1);
    const fechadoCount = list.filter(({cl})=>(timelines[cl.id]||{}).fechadoAte===pk).length;
    const conferidoCount = list.filter(({cl})=>(timelines[cl.id]||{}).conferidoAte===pk).length;
    const fechadoLabel = (periodDate < cutoff) ? (fechadoCount===0 ? 'Em dia' : fechadoCount) : 'Fechado';
    return { period: pk, fechadoLabel, conferidoCount };
  });
}

async function computeClientTimelines(){
  let allMonths = {};
  try{
    allMonths = await window.__fbListMonthDocs();
  }catch(e){
    console.error('Erro ao buscar histórico de meses', e);
    return {};
  }
  const monthKeys = Object.keys(allMonths).sort();
  const timelines = {};
  config.clients.forEach(cl=>{ timelines[cl.id] = { fechadoAte:null, conferidoAte:null }; });
  monthKeys.forEach(mk=>{
    let data = {};
    try{ data = allMonths[mk] ? JSON.parse(allMonths[mk]) : {}; }catch(e){ data = {}; }
    Object.keys(data).forEach(clientId=>{
      if(!timelines[clientId]) return;
      const entry = data[clientId];
      if(entry.status==='concluido'){
        timelines[clientId].fechadoAte = mk;
        timelines[clientId].conferidoAte = mk;
      }else if(entry.status==='revisao_final'){
        timelines[clientId].conferidoAte = mk;
      }
    });
  });
  return timelines;
}

function buildResponsibleSummary(list, timelines){
  const byResp = {};
  list.forEach(({cl})=>{
    const key = cl.responsible || 'Sem responsável';
    if(!byResp[key]) byResp[key] = { total:0, emDiaFechado:0, emDiaConferido:0 };
    byResp[key].total++;
    const t = timelines[cl.id] || {};
    if(t.fechadoAte === currentMonthKey) byResp[key].emDiaFechado++;
    if(t.conferidoAte === currentMonthKey) byResp[key].emDiaConferido++;
  });
  return Object.keys(byResp).sort().map(name=>({ name, ...byResp[name] }));
}

async function exportExcel(event){
  if(typeof XLSX==='undefined'){ alert('Não foi possível carregar o gerador de Excel. Verifique sua conexão com a internet e tente novamente.'); return; }
  const list = getFilteredSortedClients();
  if(list.length===0){ alert('Não há clientes para exportar com os filtros atuais.'); return; }
  const btn = event ? event.target : null;
  const origText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando…'; }

  const timelines = await computeClientTimelines();

  const rows = list.map(({cl,c})=>{
    const t = timelines[cl.id] || {};
    return {
      'Responsável': cl.responsible || 'Sem responsável',
      'Tributação': cl.taxRegime || 'Não informado',
      'Cliente': cl.name,
      'Fechado até': monthKeyToShort(t.fechadoAte),
      'Conferido até': monthKeyToShort(t.conferidoAte),
      'Status (mês atual)': STAGE_LABELS[c.status],
      'Progresso (mês atual)': pct(c) + '%'
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Empresas');

  const summary = buildResponsibleSummary(list, timelines);
  const summaryRows = summary.map(s=>({
    'Responsável': s.name,
    'Total de empresas': s.total,
    [`Em dia (fechado) — ${monthLabel(currentMonthKey)}`]: s.emDiaFechado,
    [`Em dia (conferido) — ${monthLabel(currentMonthKey)}`]: s.emDiaConferido
  }));
  const ws2 = XLSX.utils.json_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb, ws2, 'Por Responsável');

  const periodSummary = buildPeriodSummary(list, timelines);
  const periodRows = periodSummary.map(p=>({
    'Período': monthKeyToAbbr(p.period),
    'Empresas Fechadas até': p.fechadoLabel,
    'Empresas Conferidas até': p.conferidoCount
  }));
  const ws3 = XLSX.utils.json_to_sheet(periodRows);
  XLSX.utils.book_append_sheet(wb, ws3, 'Por Período');

  XLSX.writeFile(wb, `fechamentos_${currentMonthKey}.xlsx`);
  if(btn){ btn.disabled = false; btn.textContent = origText; }
}

function handleImportClientsFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    const text = e.target.result;
    const existingNames = new Set(config.clients.map(c=>c.name.trim().toLowerCase()));
    const existingMembers = new Set(config.teamMembers.map(m=>m.toLowerCase()));
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
    let added = 0, skipped = 0, newMembers = 0;
    lines.forEach(line=>{
      let delim = null;
      if(line.includes(';')) delim = ';';
      else if(line.includes('\t')) delim = '\t';
      else if(line.includes(',')) delim = ',';
      const parts = delim ? line.split(delim).map(p=>p.trim()) : [line.trim()];
      const name = parts[0];
      if(!name) return;
      const key = name.toLowerCase();
      if(existingNames.has(key)){ skipped++; return; }
      existingNames.add(key);

      const responsibleRaw = (parts[1]||'').trim();
      let responsible = '';
      if(responsibleRaw){
        const match = config.teamMembers.find(m=>m.toLowerCase()===responsibleRaw.toLowerCase());
        responsible = match || responsibleRaw;
        if(!match){
          config.teamMembers.push(responsible);
          existingMembers.add(responsible.toLowerCase());
          newMembers++;
        }
      }

      const regimeRaw = (parts[2]||'').trim();
      let taxRegime = '';
      if(regimeRaw){
        const match = TAX_REGIMES.find(r=>r.toLowerCase()===regimeRaw.toLowerCase());
        taxRegime = match || regimeRaw;
      }

      config.clients.push({id: uid('cl'), name, taxRegime, responsible, startMonth: currentMonthKey});
      added++;
    });
    if(added>0){ render(); saveConfig(); }
    let msg = `Importação concluída: ${added} cliente(s) adicionado(s)`;
    if(skipped>0) msg += `, ${skipped} ignorado(s) por já existir na lista`;
    if(newMembers>0) msg += `. ${newMembers} nome(s) de responsável foram adicionados à equipe automaticamente — confira em Equipe`;
    alert(msg + '.');
    event.target.value = '';
  };
  reader.onerror = function(){
    alert('Não foi possível ler o arquivo. Verifique se é um arquivo .txt válido.');
  };
  reader.readAsText(file, 'UTF-8');
}

  if(!name.trim()) return;
  if(config.teamMembers.includes(name.trim())) return;
  config.teamMembers.push(name.trim());
  render(); saveConfig();
}
async function removeMember(name){
  config.teamMembers = config.teamMembers.filter(m=>m!==name);
  render(); saveConfig();
}
async function addChecklistItem(text){
  if(!text.trim()) return;
  config.checklistTemplate.push({text: text.trim(), guide: ''});
  render(); saveConfig();
}
async function removeChecklistItem(idx){
  config.checklistTemplate.splice(idx,1);
  render(); saveConfig();
}
function normalizeTplItem(idx){
  const t = config.checklistTemplate[idx];
  if(typeof t === 'string'){ config.checklistTemplate[idx] = {text: t, guide: ''}; }
}
async function updateChecklistItemText(idx, value){
  normalizeTplItem(idx);
  config.checklistTemplate[idx].text = value;
  await saveConfig();
}
async function updateChecklistItemGuide(idx, value){
  normalizeTplItem(idx);
  config.checklistTemplate[idx].guide = value;
  await saveConfig();
}
async function updateOfficeName(name){
  config.officeName = name;
  await saveConfig();
}

function detailHtml(cl, c){
  const stageOrder = ['pendente','revisao_final','concluido'];
  const stageIdx = stageOrder.indexOf(c.status);
  const total = c.checklist.length || 1;
  const nDone = c.checklist.filter(i=>i.done).length;

  const stageDefs = [
    { label:'1 · Fechamento inicial', who:c.executor,  cur:`em andamento — ${nDone} de ${total} itens`, doneTxt:'concluído' },
    { label:'2 · Revisão final', who:c.aprovador, cur:'aguardando finalização', doneTxt:'finalizada' }
  ];
  const stagesHtml = stageDefs.map((s,i)=>{
    let cls = 'stage', txt = 'aguardando';
    if(stageIdx > i){ cls += ' done'; txt = s.doneTxt + (s.who ? ' por '+escapeHtml(s.who) : ''); }
    else if(stageIdx === i){ cls += ' cur'; txt = s.cur; }
    return `<div class="${cls}"><b>${s.label}</b>${txt}</div>`;
  }).join('');

  const locked = c.status==='concluido';
  const field = c.status==='pendente' ? 'done' : null;
  const allDone = c.checklist.every(i=>i.done);

  let selectAllRow = '';
  if(field){
    const all = allDone;
    selectAllRow = `<label class="select-all-row">
      <input type="checkbox" ${all?'checked':''} onchange="toggleAllItems('${cl.id}','${field}')">
      <span>Marcar todos</span>
    </label>`;
  }

  const rows = c.checklist.map(item=>{
    const checked = field ? item[field] : true;
    const key = cl.id+':'+item.id;
    const guideOpen = openGuides.has(key);
    const hasNote = item.note && item.note.trim();
    return `<div class="check ${checked?'done':''}">
      <div class="line">
        <input type="checkbox" ${checked?'checked':''} ${field?'':'disabled'} ${field?`onchange="toggleItem('${cl.id}','${item.id}','${field}')"`:''}>
        <span class="t">${escapeHtml(item.text)}</span>
        <input type="text" class="obs ${hasNote?'has':''}" id="obs_${cl.id}_${item.id}" value="${escapeHtml(item.note||'')}" placeholder="Observação: ex. falta nota fiscal do fornecedor X…" ${locked?'disabled':''} onchange="updateItemNote('${cl.id}','${item.id}', this.value)">
        ${item.guide ? `<button type="button" class="help ${guideOpen?'on':''}" title="Como fazer" onclick="toggleGuide(this,'${key}')">?</button>` : `<span class="help-sp"></span>`}
      </div>
      ${item.guide ? `<div class="guide-box ${guideOpen?'show':''}">${escapeHtml(item.guide)}</div>` : ''}
    </div>`;
  }).join('');

  let actionButtons = '', hint = '';
  if(c.status==='pendente'){
    actionButtons = `<button class="btn" ${allDone?'':'disabled'} onclick="sendToFinalReview('${cl.id}')">Enviar para revisão final</button>`;
    if(!allDone) hint = `<div class="hint">Marque todos os itens do checklist para liberar o envio à revisão final.</div>`;
  } else if(c.status==='revisao_final'){
    actionButtons = `<button class="btn ghost small" onclick="reopenClosing('${cl.id}')">Reabrir</button>
      <button class="btn" onclick="finalizeClosing('${cl.id}')">Finalizar fechamento</button>`;
    hint = `<div class="hint">Revisão final antes de encerrar o mês para este cliente.</div>`;
  } else {
    actionButtons = `<button class="btn ghost small" onclick="reopenClosing('${cl.id}')">Reabrir fechamento</button>`;
  }

  const cascadeCheckbox = (c.status!=='concluido') ? `<label class="cascade-toggle">
    <input type="checkbox" ${cascadeEnabled?'checked':''} onchange="setCascadeEnabled(this.checked)">

  </label>` : '';

  const historyHtml = c.history.length ? `<div class="history"><div class="section-label">Histórico</div><ul>${
    c.history.slice().reverse().map(h=>`<li>${h.t} — ${escapeHtml(h.what)} (${escapeHtml(h.who)})</li>`).join('')
  }</ul></div>` : '';

  return `<div class="detail">
    <div class="stages">${stagesHtml}</div>
    ${selectAllRow}
    <div class="dchecks">${rows}</div>
    ${hint}
    <div class="signoffs">
      <div class="signoff"><div class="role">Fechamento inicial</div><div class="name ${!c.executor?'empty':''}">${c.executor?escapeHtml(c.executor):'—'}</div></div>

    </div>
    ${historyHtml}
    <div class="dfoot">${cascadeCheckbox}${actionButtons}</div>
  </div>`;
}

// 1ª etapa = saiu de "pendente" (fechamento inicial); 2ª = revisão final concluída.
function computeRankData(){
  const [yy, curM] = currentMonthKey.split('-').map(Number);
  const keys = [];
  for(let m=1; m<curM; m++) keys.push(yy + '-' + String(m).padStart(2,'0'));
  const parsed = {};
  keys.forEach(k=>{
    try{ parsed[k] = rankState.docs && rankState.docs[k] ? JSON.parse(rankState.docs[k]) : {}; }
    catch(e){ parsed[k] = {}; }
  });
  const rank = e => e ? (STATUS_ORDER[e.status] || 0) : 0;
  // Cada empresa só conta nos meses entre o início e o encerramento (mês fora do período = -1).
  const clients = config.clients.map(cl=>{
    const s = [0,0]; let n = 0;
    const monthly = keys.map(k=>{
      if(!clientCounts(cl, k)) return -1;
      n++;
      const r = rank(parsed[k][cl.id]);
      if(r>=1) s[0]++; if(r>=2) s[1]++;
      return r;
    });
    return { cl, s, monthly, n };
  }).filter(x=>x.n>0);
  const byResp = {};
  clients.forEach(x=>{
    const key = x.cl.responsible || '__none__';
    const e = byResp[key] || (byResp[key] = { key, name:x.cl.responsible || 'Sem responsável', nClients:0, tot:0, s:[0,0], monthS:keys.map(()=>[0,0]), monthN:keys.map(()=>0) });
    e.nClients++; e.tot += x.n;
    x.s.forEach((v,i)=>{ e.s[i]+=v; });
    x.monthly.forEach((r,mi)=>{
      if(r<0) return;
      e.monthN[mi]++;
      for(let st=0; st<2; st++){ if(r>=st+1) e.monthS[mi][st]++; }
    });
  });
  const hidden = n => RESP_SUMMARY_HIDE.some(h=>n.toLowerCase().startsWith(h));
  const resp = Object.values(byResp).filter(e=>!hidden(e.name)).map(e=>{
    const p = e.s.map(v=> e.tot ? Math.round(100*v/e.tot) : 0);
    const monthly = e.monthS.map((ms,mi)=> e.monthN[mi] ? Math.round(100*(ms[0]+ms[1])/(2*e.monthN[mi])) : null);
    return { name:e.name, key:e.key, nClients:e.nClients, tot:e.tot, counts:e.s, p, geral: Math.round((p[0]+p[1])/2), monthly };
  });
  return { keys, clients, resp };
}

function rankViewHtml(){
  const head = `<div class="rv-head">
    <button class="pill" onclick="closeRank()">← Voltar ao fechamento</button>
    <div><h2>🏆 Rankings</h2><p id="rankPeriod"></p></div>
  </div>`;
  if(rankState.loading) return head + `<div class="loading">Carregando histórico dos meses…</div>`;
  if(rankState.error) return head + `<div class="rcard"><div class="rsm">Não foi possível carregar o histórico. Verifique a conexão e tente de novo.</div></div>`;

  const d = computeRankData();
  const [yy] = currentMonthKey.split('-');
  if(!d.keys.length){
    return head + `<div class="rcard"><div class="rsm">Ainda não há meses anteriores em ${yy} para comparar — o ranking considera janeiro até o mês anterior ao mês selecionado.</div></div>`;
  }
  const period = `${MONTH_ABBR[0]}–${MONTH_ABBR[d.keys.length-1]}/${yy} (${d.keys.length} ${d.keys.length===1?'mês':'meses'}, até o mês anterior ao selecionado)`;
  const tabs = [['geral','Geral'],['mes','Por mês'],['etapa','Por etapa'],['emp','Empresas concluídas']];
  const tabsHtml = `<div class="rtabs">${tabs.map(([k,l])=>`<button class="rt ${rankTab===k?'on':''}" onclick="setRankTab('${k}')">${l}</button>`).join('')}</div>`;
  const stageNames = ['1ª · Fechamento inicial','2ª · Revisão final'];
  let body = '';

  if(rankTab==='geral'){
    const rows = d.resp.slice().sort((a,b)=>b.geral-a.geral).map((r,i)=>`<tr>${rkPos(i)}
      <td><b>${escapeHtml(r.name)}</b><div class="rsm">${r.nClients} empresa(s) · ${r.tot} fechamentos</div></td>
      ${r.p.map((p,si)=>`<td>${rkBar(p, p+'%')}</td>`).join('')}
      <td>${rkBar(r.geral, r.geral+'%', 'geral')}</td></tr>`).join('');
    body = `<div class="rcard"><h4>Ranking geral por responsável</h4>
      <table class="rank"><thead><tr><th>#</th><th>Responsável</th>${stageNames.map(n=>`<th>${n}</th>`).join('')}<th>Geral</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="rsm" style="margin-top:10px">% de fechamentos (empresa × mês) que chegaram ao fim de cada etapa. Geral = média das duas etapas.</p></div>`;
  } else if(rankTab==='mes'){
    const rows = d.resp.slice().sort((a,b)=>b.geral-a.geral).map(r=>`<tr><td><b>${escapeHtml(r.name)}</b></td>${r.monthly.map(v=> v===null ? `<td><span class="rsm">—</span></td>` : `<td><span class="hm" style="--v:${v}">${v}%</span></td>`).join('')}</tr>`).join('');
    body = `<div class="rcard"><h4>Evolução por mês · % geral concluído</h4>
      <table class="rank hmt"><thead><tr><th>Responsável</th>${d.keys.map((k,i)=>`<th>${MONTH_ABBR[i]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
      <p class="rsm" style="margin-top:10px">Cada célula = % das empresas do responsável que concluíram as etapas naquele mês (média das duas). Mais forte = melhor.</p></div>`;
  } else if(rankTab==='etapa'){
    const si = rankStage;
    const rows = d.resp.slice().sort((a,b)=>b.p[si]-a.p[si]).map((r,i)=>`<tr>${rkPos(i)}<td><b>${escapeHtml(r.name)}</b></td><td>${rkBar(r.p[si], r.p[si]+'%')}</td><td class="rsm">${r.counts[si]}/${r.tot}</td></tr>`).join('');
    body = `<div class="rcard"><h4>Ranking por etapa</h4>
      <div class="rtabs sub">${stageNames.map((n,i)=>`<button class="rt ${si===i?'on':''}" onclick="setRankStage(${i})">${n}</button>`).join('')}</div>
      <table class="rank"><thead><tr><th>#</th><th>Responsável</th><th>${stageNames[si]}</th><th>Fechamentos</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else {
    const hidden = n => RESP_SUMMARY_HIDE.some(h=>(n||'').toLowerCase().startsWith(h));
    const list = d.clients.filter(x=>!hidden(x.cl.responsible)).slice().sort((a,b)=> (b.s[1]-a.s[1]) || (b.s[0]-a.s[0]) || a.cl.name.localeCompare(b.cl.name));
    const rows = list.map((x,i)=>`<tr>${rkPos(i)}<td><b>${escapeHtml(x.cl.name)}</b>${x.cl.closed?' <span class="rsm">(encerrada)</span>':''}</td><td class="rsm">${escapeHtml(x.cl.responsible||'—')}</td>
      <td>${rkBar(Math.round(100*x.s[1]/x.n), x.s[1]+'/'+x.n+' meses')}</td>
      <td class="rsm">${x.s[0]} · ${x.s[1]}</td></tr>`).join('');
    body = `<div class="rcard"><h4>Empresas com fechamento concluído · janeiro até o mês anterior</h4>
      <table class="rank"><thead><tr><th>#</th><th>Empresa</th><th>Responsável</th><th>Meses concluídos</th><th>Por etapa (1ª · 2ª)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return head.replace('<p id="rankPeriod"></p>', `<p>${period}</p>`) + tabsHtml + body;
}

function renderConfigModal(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeConfig(); };
  overlay.innerHTML = `<div class="modal cfg-tab-${cfgTab}">
    <div class="modal-head">
      <div><h2>Cadastros</h2><div class="meta">Responsáveis, empresas e checklist</div></div>
      <button class="close-x" onclick="closeConfig()">✕</button>
    </div>
    <div class="modal-body">
      <div class="rtabs sub">
        <button class="rt ${cfgTab==='resp'?'on':''}" onclick="setCfgTab('resp')">👤 Responsáveis</button>
        <button class="rt ${cfgTab==='emp'?'on':''}" onclick="setCfgTab('emp')">🏢 Empresas</button>
        <button class="rt ${cfgTab==='enc'?'on':''}" onclick="setCfgTab('enc')">🚪 Empresas Encerradas</button>
        <button class="rt ${cfgTab==='check'?'on':''}" onclick="setCfgTab('check')">✅ Checklist e escritório</button>
      </div>
      <div class="cfg-block" data-tab="check">
        <h3>Nome do escritório</h3>
        <input type="text" value="${escapeHtml(config.officeName)}" onchange="updateOfficeName(this.value)" style="width:100%;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:3px;">
      </div>

      <div class="cfg-block" data-tab="resp">
        <h3>Equipe</h3>
        <div class="cfg-list">
          ${config.teamMembers.map(m=>`<div class="cfg-item"><input type="text" value="${escapeHtml(m)}" disabled><button class="del" onclick="removeMember('${escapeHtml(m).replace(/'/g,"\\'")}')">✕</button></div>`).join('') || '<div style="font-size:12.5px;color:var(--ink-soft);">Nenhum integrante ainda.</div>'}
        </div>
        <div class="add-row">
          <input type="text" id="newMemberInput" placeholder="Nome do integrante">
          <button class="btn small" onclick="submitNewMember()">Adicionar</button>
        </div>
      </div>

      <div class="cfg-block" data-tab="emp">
        <h3>Empresas</h3>
        <div class="cfg-filter-row">
          <input type="text" id="cfgClientSearchInput" placeholder="Buscar por nome, tributação ou responsável…" value="${escapeHtml(cfgClientSearch)}" oninput="setCfgClientSearch(this.value)">
          <select onchange="setCfgClientSort(this.value)">
            <option value="name" ${cfgClientSort==='name'?'selected':''}>Ordenar: Nome (A–Z)</option>
            <option value="name_desc" ${cfgClientSort==='name_desc'?'selected':''}>Ordenar: Nome (Z–A)</option>
            <option value="regime" ${cfgClientSort==='regime'?'selected':''}>Ordenar: Tributação</option>
            <option value="responsible" ${cfgClientSort==='responsible'?'selected':''}>Ordenar: Responsável</option>
          </select>
        </div>
        <div class="hint" style="margin-bottom:8px;">${getCfgClients().length} de ${config.clients.filter(c=>!c.closed).length} empresa(s)</div>
        <div class="cfg-list">
          ${getCfgClients().map(c=>`<div class="cfg-client-item">
            <div class="cfg-item">
              <input type="text" value="${escapeHtml(c.name)}" onchange="updateClientName('${c.id}', this.value)">
              <button class="del" onclick="removeClient('${c.id}')">✕</button>
            </div>
            <div class="cfg-client-selects">
              <select onchange="updateClientRegime('${c.id}', this.value)">
                <option value="" ${!c.taxRegime?'selected':''}>Tributação…</option>
                ${TAX_REGIMES.map(r=>`<option value="${r}" ${c.taxRegime===r?'selected':''}>${r}</option>`).join('')}
              </select>
              <select onchange="updateClientResponsible('${c.id}', this.value)">
                <option value="" ${!c.responsible?'selected':''}>Responsável…</option>
                ${config.teamMembers.map(m=>`<option value="${escapeHtml(m)}" ${c.responsible===m?'selected':''}>${escapeHtml(m)}</option>`).join('')}
              </select>
            </div>
            <div class="cfg-client-selects" style="margin-top:6px;align-items:center;">
              <label class="start-lbl">Início do fechamento: <input type="month" value="${escapeHtml(c.startMonth||'')}" onchange="updateClientStart('${c.id}', this.value)"></label>
              <button class="btn ghost small" style="margin-left:auto" onclick="closeCompany('${c.id}')">Encerrar empresa</button>
            </div>
          </div>`).join('') || `<div style="font-size:12.5px;color:var(--ink-soft);">${config.clients.some(c=>!c.closed) ? 'Nenhuma empresa encontrada.' : 'Nenhuma empresa ainda.'}</div>`}
        </div>
        <div class="add-row">
          <input type="text" id="newClientInput" placeholder="Nome do cliente">
          <button class="btn small" onclick="submitNewClient()">Adicionar</button>
        </div>
        <div class="import-row">
          <input type="file" id="importClientsFile" accept=".txt,text/plain" style="display:none" onchange="handleImportClientsFile(event)">
          <button class="btn ghost small" onclick="document.getElementById('importClientsFile').click()">Importar lista (.txt)</button>
          <span class="hint-inline">uma empresa por linha: Nome;Responsável;Tributação</span>
        </div>
      </div>

      <div class="cfg-block" data-tab="enc">
        <h3>Empresas Encerradas</h3>
        <div class="hint" style="margin-bottom:8px;">Não aparecem na lista de fechamentos nem nos cadastros atuais. O ranking conta cada uma só do início até o mês de encerramento.</div>
        <div class="cfg-list">
          ${config.clients.filter(c=>c.closed).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<div class="cfg-client-item">
            <div class="cfg-item">
              <input type="text" value="${escapeHtml(c.name)}" disabled>
              <button class="btn ghost small" onclick="reopenCompany('${c.id}')">Reativar</button>
              <button class="del" title="Remover definitivamente" onclick="removeClient('${c.id}')">✕</button>
            </div>
            <div class="hint-inline">${escapeHtml(c.responsible||'Sem responsável')} · ${escapeHtml(c.taxRegime||'Tributação não informada')} · de ${escapeHtml(monthKeyToAbbr(c.startMonth||c.endMonth))} até ${escapeHtml(monthKeyToAbbr(c.endMonth||c.startMonth))}</div>
          </div>`).join('') || '<div style="font-size:12.5px;color:var(--ink-soft);">Nenhuma empresa encerrada.</div>'}
        </div>
      </div>

      <div class="cfg-block" data-tab="check">
        <h3>Checklist padrão de fechamento</h3>
        <div class="cfg-list">
          ${config.checklistTemplate.map((t,i)=>{
            const text = typeof t === 'string' ? t : t.text;
            const guide = typeof t === 'string' ? '' : (t.guide||'');
            return `<div class="cfg-tpl-item">
              <div class="cfg-item">
                <input type="text" value="${escapeHtml(text)}" onchange="updateChecklistItemText(${i}, this.value)">
                <button class="del" onclick="removeChecklistItem(${i})">✕</button>
              </div>
              <details class="guide-edit">
                <summary>Passo a passo (${guide ? 'editar' : 'adicionar'})</summary>
                <textarea rows="3" placeholder="Explique como conferir este item, com os caminhos de menu do sistema…" onchange="updateChecklistItemGuide(${i}, this.value)">${escapeHtml(guide)}</textarea>
              </details>
            </div>`;
          }).join('')}
        </div>
        <div class="add-row">
          <input type="text" id="newItemInput" placeholder="Novo item do checklist">
          <button class="btn small" onclick="submitNewItem()">Adicionar</button>
        </div>
        <div class="hint" style="margin-top:10px;">Alterações no checklist valem para novos meses. Meses já iniciados mantêm o checklist original.</div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeConfig()">Concluído</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.scrollTop = pendingScrollRestore;
}

function submitNewMember(){
  const el = document.getElementById('newMemberInput');
  addMember(el.value); 
}
function submitNewClient(){
  const el = document.getElementById('newClientInput');
  addClient(el.value);
}
function submitNewItem(){
  const el = document.getElementById('newItemInput');
  addChecklistItem(el.value);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function goMonth(delta){
  currentMonthKey = shiftMonth(currentMonthKey, delta);
  await loadMonth(currentMonthKey);
  render();
}
async function setUser(name){
  currentUser = name;
  if(window.__fbUser && window.__fbUser.email && name){
    if(!config.memberEmails) config.memberEmails = {};
    config.memberEmails[window.__fbUser.email.toLowerCase()] = name;
    saveConfig();
  }
  render();
}
function openConfig(){ showConfig = true; render(); }
function closeConfig(){ showConfig = false; render(); }

boot();
</script>
</body>
</html>
